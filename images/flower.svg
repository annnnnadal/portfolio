<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
  <defs><clipPath id="flower-clip"><rect width="1000" height="500"/></clipPath></defs>
  <g clip-path="url(#flower-clip)">
    <!-- Eje: la línea vertical del portfolio entra por arriba y llega a la base (500,500) -->
    <path id="flower-axis" d="M500 0V500"/>
    <!-- Anillos: círculos tangentes en la base, del más pequeño al más grande. Cada uno en dos mitades que nacen de la base -->
    <g id="flower-rings">
      <g class="ring" data-order="1">
        <path d="M500 500A45 45 0 0 1 500 410"/>
        <path d="M500 500A45 45 0 0 0 500 410"/>
      </g>
      <g class="ring" data-order="2">
        <path d="M500 500A85 85 0 0 1 500 330"/>
        <path d="M500 500A85 85 0 0 0 500 330"/>
      </g>
      <g class="ring" data-order="3">
        <path d="M500 500A140 140 0 0 1 500 220"/>
        <path d="M500 500A140 140 0 0 0 500 220"/>
      </g>
      <g class="ring" data-order="4">
        <path d="M500 500A215 215 0 0 1 500 70"/>
        <path d="M500 500A215 215 0 0 0 500 70"/>
      </g>
      <g class="ring" data-order="5">
        <path d="M500 500A320 320 0 0 1 500 -140"/>
        <path d="M500 500A320 320 0 0 0 500 -140"/>
      </g>
      <g class="ring" data-order="6">
        <path d="M500 500A470 470 0 0 1 500 -440"/>
        <path d="M500 500A470 470 0 0 0 500 -440"/>
      </g>
    </g>
    <!-- Abanico: arcos que salen verticales de la base y bajan a los lados, del más pequeño al más grande -->
    <g id="flower-fan">
      <g class="petal" data-order="1">
        <path d="M500 500A30 30 0 0 1 560 500"/>
        <path d="M500 500A30 30 0 0 0 440 500"/>
      </g>
      <g class="petal" data-order="2">
        <path d="M500 500A55 55 0 0 1 610 500"/>
        <path d="M500 500A55 55 0 0 0 390 500"/>
      </g>
      <g class="petal" data-order="3">
        <path d="M500 500A90 90 0 0 1 680 500"/>
        <path d="M500 500A90 90 0 0 0 320 500"/>
      </g>
      <g class="petal" data-order="4">
        <path d="M500 500A135 135 0 0 1 770 500"/>
        <path d="M500 500A135 135 0 0 0 230 500"/>
      </g>
      <g class="petal" data-order="5">
        <path d="M500 500A195 195 0 0 1 890 500"/>
        <path d="M500 500A195 195 0 0 0 110 500"/>
      </g>
      <g class="petal" data-order="6">
        <path d="M500 500A270 270 0 0 1 1040 500"/>
        <path d="M500 500A270 270 0 0 0 -40 500"/>
      </g>
      <g class="petal" data-order="7">
        <path d="M500 500A370 370 0 0 1 1240 500"/>
        <path d="M500 500A370 370 0 0 0 -240 500"/>
      </g>
      <g class="petal" data-order="8">
        <path d="M500 500A500 500 0 0 1 1500 500"/>
        <path d="M500 500A500 500 0 0 0 -500 500"/>
      </g>
      <g class="petal" data-order="9">
        <path d="M500 500A700 700 0 0 1 1900 500"/>
        <path d="M500 500A700 700 0 0 0 -900 500"/>
      </g>
    </g>
  </g>
</svg>
